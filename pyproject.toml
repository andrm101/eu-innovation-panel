[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-innovation-panel"
version = "0.1.0"
description = "EU Regional Innovation Ecosystem — exploratory, non-causal descriptive analysis"
requires-python = ">=3.11"
dependencies = [
    # Data handling
    "pandas>=2.2,<3",
    "geopandas>=0.14,<1",
    "pyarrow>=15,<16",
    "duckdb>=0.10,<1",
    # Validation
    "pandera>=0.18,<1",
    # Statistics & ML
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<1",
    "scipy>=1.12,<2",
    "pingouin>=0.5,<1",
    "pyampute>=0.1,<1",
    "hdbscan>=0.8,<1",
    # Spatial
    "esda>=2.5,<3",
    "libpysal>=4.9,<5",
    # Visualisation
    "plotly>=5.20,<6",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "kaleido==0.2.1",
    # Dashboard
    "dash>=2.16,<3",
    # Logging
    "structlog>=23.3,<25",
    # Templating & reporting
    "jinja2>=3.1,<4",
    "pypdf>=4.0,<5",
    # Citations
    "habanero>=1.2,<2",
    # Dev tools
    "ruff>=0.3,<1",
    "black>=24,<25",
    "pre-commit>=3.7,<4",
    "pytest>=8.0,<9",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<7",
    "jupyter>=1.0,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests", "dashboard/tests"]
